version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: neuronose-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuronose}
      POSTGRES_USER: ${POSTGRES_USER:-neuronose}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neuronose}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
