spring:
  application:
    name: neuronose-backend-test
  datasource:
    url: jdbc:h2:mem:neuronosedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

neuronose:
  demo-mode: false
  cors:
    allowed-origins: "*"

logging:
  level:
    root: INFO
    com.neuronose: DEBUG
